<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Voxel Wreckers is a pass-and-play 3D demolition game.">
<title>Voxel Wreckers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Rubik:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #2a1840; overflow: hidden; overscroll-behavior: none; }
    a { color: #ffb36b; } a:hover { color: #ffd98a; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.webgpu.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js?v=4"></script>
</helmet>
<div data-screen-label="Voxel Wreckers" style="position: fixed; inset: 0; background: #2a1840; overflow: hidden;">
  <x-import component-from-global-scope="voxel-game" rounds="{{ rounds }}" debris-amount="{{ debrisAmount }}" collapse-threshold="{{ collapseThreshold }}" explosiveness="{{ explosiveness }}" hint-size="100%,100%" style="position: absolute; inset: 0;"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;rounds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:6,&quot;section&quot;:&quot;Rules&quot;},&quot;debrisAmount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0.5,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;section&quot;:&quot;Destruction&quot;},&quot;explosiveness&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.2,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;×&quot;,&quot;section&quot;:&quot;Destruction&quot;},&quot;collapseThreshold&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.7,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0.3,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;unit&quot;:&quot;×&quot;,&quot;section&quot;:&quot;Destruction&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      rounds: this.props.rounds ?? 3,
      debrisAmount: this.props.debrisAmount ?? 1,
      collapseThreshold: this.props.collapseThreshold ?? 0.5,
      explosiveness: this.props.explosiveness ?? 1,
    };
  }
}
</script>
</body>
</html>
